# Local development: `docker compose up -d` starts only MongoDB (run the API and client with pnpm).
# Full stack:        `docker compose --profile app up --build -d`  ->  http://localhost:8080
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/meanstack
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: '1' # nginx sits in front
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
